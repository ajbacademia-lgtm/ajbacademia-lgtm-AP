<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Academic Publishing Group</title>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./index.css">
    <style>
      .btn-pill {
        border-radius: 9999px;
        padding: 0.5rem 1.5rem;
        font-weight: 600;
        transition: all 0.2s;
      }
      .section-underline {
        position: relative;
        display: inline-block;
      }
      .section-underline::after {
        content: '';
        position: absolute;
        bottom: -4px;
        left: 0;
        width: 100%;
        height: 2px;
        background-color: #002147;
      }
    </style>
</head>
